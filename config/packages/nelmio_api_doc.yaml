nelmio_api_doc:
    documentation:
        info:
            title: Workout Tracker API
            description: Backend API for the Workout Tracker mobile app.
            version: 1.0.0
        components:
            schemas:
                Error:
                    type: object
                    description: Every error response has this shape (RFC 9457 problem details). `title` and `detail` are translated into the requested language; show them, do not parse them.
                    required: [type, title, status, detail]
                    properties:
                        type: { type: string, example: 'about:blank' }
                        title: { type: string, example: Conflict }
                        status: { type: integer, example: 409 }
                        detail: { type: string }
                ValidationError:
                    description: An `Error` with one violation per invalid field (status 422).
                    allOf:
                        - $ref: '#/components/schemas/Error'
                        - type: object
                          required: [violations]
                          properties:
                              violations:
                                  type: array
                                  items:
                                      type: object
                                      required: [field, message]
                                      properties:
                                          field: { type: string, example: email }
                                          message: { type: string }
            responses:
                Unauthorized:
                    description: Missing, invalid or expired credentials.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                Conflict:
                    description: The request conflicts with the current state.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                ValidationFailed:
                    description: The submitted data is invalid (violations per field).
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ValidationError' }
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        # Every endpoint needs a JWT unless it overrides this with `security: []` (see the auth controllers).
        security:
            - Bearer: []
        paths:
            # Handled by gesdinet's refresh_jwt authenticator (no controller), so it is described here.
            /api/auth/refresh:
                post:
                    operationId: refreshToken
                    tags: [Authentication]
                    summary: Exchange a refresh token for a new JWT (the refresh token is single-use and is replaced).
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [refresh_token]
                                    properties:
                                        refresh_token: { type: string }
                    responses:
                        '200':
                            description: New JWT and a new refresh token.
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        required: [token, refresh_token]
                                        properties:
                                            token: { type: string }
                                            refresh_token: { type: string }
                        '401':
                            $ref: '#/components/responses/Unauthorized'
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc.json
