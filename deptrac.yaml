deptrac:
    paths:
        - src
    layers:
        - name: Framework
          collectors:
            - type: classLike
              value: ^(Symfony|Doctrine)\\.*
        - name: SharedKernelDomain
          collectors:
            - type: classLike
              value: ^App\\SharedKernel\\Domain\\.*
        - name: SharedKernelInfrastructure
          collectors:
            - type: classLike
              value: ^App\\SharedKernel\\Infrastructure\\.*
        - name: SharedKernelPresentation
          collectors:
            - type: classLike
              value: ^App\\SharedKernel\\Presentation\\.*
        - name: Kernel
          collectors:
            - type: classLike
              value: ^App\\Kernel$
        - name: ProgressDomain
          collectors:
            - type: classLike
              value: ^App\\Progress\\Domain\\.*
        - name: ProgressApplication
          collectors:
            - type: classLike
              value: ^App\\Progress\\Application\\.*
        - name: ProgressPresentation
          collectors:
            - type: classLike
              value: ^App\\Progress\\Presentation\\.*
    ruleset:
        # A domain layer depends on SharedKernelDomain only: never on Symfony, Doctrine or other contexts.
        ProgressDomain: [SharedKernelDomain]
        ProgressApplication: [ProgressDomain, SharedKernelDomain, Framework]
        ProgressPresentation: [ProgressApplication, ProgressDomain, SharedKernelDomain, Framework]
        SharedKernelDomain: []
        SharedKernelInfrastructure: [SharedKernelDomain, Framework]
        SharedKernelPresentation: [SharedKernelDomain, Framework]
        Kernel: [SharedKernelDomain, SharedKernelInfrastructure, SharedKernelPresentation, Framework]
